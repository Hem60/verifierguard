[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verifierguard"
version = "0.1.0"
description = "Red-team the verifier of an AI agent benchmark task: try to cheat it, suggest a fix, prove the fix."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Patel Hemkumar" }]
keywords = ["ai-agents", "benchmark", "verifier", "red-team", "harbor", "terminal-bench"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
]
dependencies = ["typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
verifierguard = "verifierguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/verifierguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.coverage.run]
source = ["verifierguard"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["examples", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
